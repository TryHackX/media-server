[build-system]
# PEP 639 licence metadata (license = "MIT") needs setuptools 77+.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tryhackx-media-server"
version = "0.1.0"
description = "Secure, cross-platform media catalogue and transfer service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
dependencies = [
  "aiofiles>=23.2,<26",
  "cryptography>=48.0.1,<51",
  "mutagen>=1.47,<2",
  "fastapi>=0.110,<1",
  "PyMySQL>=1.1,<2",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
media-server = "media_server.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_installer.py imports scripts/install.py as a module; keep that working
# for a bare `pytest` invocation, not only `python -m pytest` from the project root.
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
