<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="30">
<title>Serwer chwilowo niedostępny</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px;
    background: #060a14; color: #f2f6fc;
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  main {
    max-width: 30rem; padding: 2rem 2.25rem; text-align: center;
    background: #0e1629; border: 1px solid #1f2d4d; border-radius: 16px;
  }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 1.25rem; border-radius: 14px;
    background: linear-gradient(135deg, #4aa3ff, #1f7ff0);
    display: grid; place-items: center; font-size: 28px; color: #04101f;
  }
  h1 { margin: 0 0 .5rem; font-size: 1.35rem; font-weight: 600; }
  p { margin: .4rem 0; color: #a3b3cf; }
  small { display: block; margin-top: 1.25rem; color: #8496b8; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">&#9208;</div>
  <h1>Serwer jest chwilowo niedostępny</h1>
  <p>Komputer z biblioteką nie odpowiada — może być wyłączony albo właśnie się uruchamia.</p>
  <p lang="en">The media server is not answering right now. It may be switched off or starting up.</p>
  <small>Strona odświeży się sama za pół minuty. · This page reloads in 30 seconds.</small>
</main>
</body>
</html>
